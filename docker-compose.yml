services:
  db:
    image: gvenzl/oracle-free:slim
    environment:
      ORACLE_PASSWORD: password
      APP_USER: STUDENT
      APP_USER_PASSWORD: password
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./backend/db-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -s APP_USER/password@localhost:1521/FREEPDB1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://backend:8080
    depends_on:
      - backend

volumes:
  oracle-data:
