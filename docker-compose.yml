services:
  db:
    image: gvenzl/oracle-free:slim
    environment:
      ORACLE_PASSWORD: password
      APP_USER: STUDENT
      APP_USER_PASSWORD: password
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./backend/db-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "printf \"SET HEADING OFF FEEDBACK OFF VERIFY OFF ECHO OFF\\nSELECT 'READY' FROM DUAL;\\nEXIT;\\n\" | sqlplus -s -L STUDENT/password@localhost:1521/FREEPDB1 | grep -q READY"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://backend:8080
    depends_on:
      - backend

  functional-tests:
    image: ${DOCKER_PLAYWRIGHT_IMAGE:-mcr.microsoft.com/playwright:v1.60.0-noble}
    working_dir: /tests
    volumes:
      - ./functional-tests:/tests
    environment:
      - BASE_URL=http://frontend:3000
    depends_on:
      - frontend
    command: sh -c "npm ci && npx playwright test"
    profiles:
      - test

volumes:
  oracle-data:
