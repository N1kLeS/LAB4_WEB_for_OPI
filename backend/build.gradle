plugins {
    id 'java'
    id 'war'
}

def javaVersionValue = providers.gradleProperty('javaVersion').get().toInteger()

java {
    sourceCompatibility = JavaVersion.toVersion(javaVersionValue)
    targetCompatibility = JavaVersion.toVersion(javaVersionValue)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersionValue
}

dependencies {
    providedCompile 'jakarta.platform:jakarta.jakartaee-api:10.0.0'
    providedCompile 'jakarta.activation:jakarta.activation-api:2.1.0'

    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'com.oracle.database.jdbc:ojdbc11:23.4.0.24.05'
    implementation 'org.jooq:jooq:3.19.1'
    implementation 'org.jooq:jooq-meta:3.19.1'

    compileOnly 'org.jooq:jooq-codegen:3.19.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('war') {
    archiveFileName = providers.gradleProperty('backendWarName').get()
}
