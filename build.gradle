plugins {
    id 'base'
}

allprojects {
    group = 'ru.nikitka'
    version = '1.0.0-SNAPSHOT'
}

def functionalTestsDir = layout.projectDirectory.dir('functional-tests').asFile
def musicFile = layout.projectDirectory.file('assets/sounds/8e8118_counter_strike_go_go_go_sound_effect.mp3').asFile
def generatedPathExcludes = [
        '.git/**',
        '.gradle/**',
        '.idea/**',
        '**/*.iml',
        '**/build/**',
        '**/bin/**',
        '**/target/**',
        '**/node_modules/**',
        '**/playwright-report/**',
        '**/test-results/**',
        '**/__MACOSX/**'
]

def runCommand = { List command ->
    def normalizedCommand = command.collect { it.toString() }
    def process = new ProcessBuilder(normalizedCommand)
            .directory(projectDir)
            .redirectErrorStream(true)
            .start()
    def output = process.inputStream.getText('UTF-8')
    def exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new RuntimeException("Command failed (${exitCode}): ${normalizedCommand.join(' ')}\n${output}")
    }
    output
}

def waitForHttp = { String url, List<Integer> expectedCodes ->
    def deadline = System.currentTimeMillis() + 180000
    while (System.currentTimeMillis() < deadline) {
        HttpURLConnection connection = null
        try {
            connection = new URI(url).toURL().openConnection() as HttpURLConnection
            connection.connectTimeout = 2000
            connection.readTimeout = 2000
            connection.requestMethod = 'GET'
            int code = connection.responseCode
            if (expectedCodes.contains(code)) {
                return
            }
        } catch (Exception ignored) {
        } finally {
            if (connection != null) {
                connection.disconnect()
            }
        }
        sleep(2000)
    }
    throw new GradleException("Timed out waiting for ${url}")
}

tasks.register('dockerBuild', Exec) {
    group = 'docker'
    description = 'Builds Docker images for all services.'
    commandLine 'docker', 'compose', 'build'
}

tasks.register('dockerUp', Exec) {
    group = 'docker'
    description = 'Starts the application with Docker Compose.'
    dependsOn tasks.named('dockerBuild')
    commandLine 'docker', 'compose', 'up', '-d'
}

tasks.register('dockerDown', Exec) {
    group = 'docker'
    description = 'Stops Docker Compose services.'
    commandLine 'docker', 'compose', 'down'
}

tasks.register('functionalTestInstall', Exec) {
    group = 'verification'
    description = 'Installs Playwright test dependencies.'
    workingDir functionalTestsDir
    commandLine 'npm', 'ci'
    inputs.files(
            file('functional-tests/package.json'),
            file('functional-tests/package-lock.json')
    )
    outputs.dir file('functional-tests/node_modules')
}

tasks.register('functionalTest', Exec) {
    group = 'verification'
    description = 'Runs Playwright functional tests against Docker Compose application.'
    dependsOn tasks.named('functionalTestInstall'), tasks.named('dockerUp')
    finalizedBy tasks.named('dockerDown')
    workingDir functionalTestsDir
    commandLine 'npm', 'test'
    environment 'APP_URL', 'http://localhost:3000'
    doFirst {
        waitForHttp('http://localhost:3000', [200])
        waitForHttp('http://localhost:8080/jsf-area-check-backend/api/auth/me', [401])
    }
}

tasks.named('check') {
    dependsOn tasks.named('functionalTest')
}

tasks.named('build') {
    dependsOn ':backend:build', ':frontend:build'
}

tasks.named('clean') {
    delete 'functional-tests/playwright-report'
    delete 'functional-tests/test-results'
}

tasks.register('compile') {
    group = 'build'
    description = 'Compiles backend sources and checks frontend sources.'
    dependsOn ':backend:classes', ':frontend:checkFrontend'
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs backend unit tests.'
    dependsOn ':backend:test'
}

tasks.register('xml') {
    group = 'verification'
    description = 'Validates XML files in the project.'
    def xmlFiles = fileTree(projectDir) {
        include '**/*.xml'
        exclude generatedPathExcludes
    }
    inputs.files(xmlFiles)
    doLast {
        def files = xmlFiles.files.toList()
        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        factory.setNamespaceAware(true)
        files.each { file ->
            factory.newDocumentBuilder().parse(file)
        }
        println "Validated ${files.size()} XML file(s)."
    }
}

tasks.register('music', Exec) {
    group = 'lab'
    description = 'Plays a sound after build.'
    dependsOn tasks.named('build')
    onlyIf {
        musicFile.exists() && System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')
    }
    commandLine 'afplay', musicFile.absolutePath
}

tasks.register('native2ascii') {
    group = 'conversion'
    description = 'Converts properties files to ASCII copies.'
    def propertiesFiles = fileTree(projectDir) {
        include '**/*.properties'
        exclude generatedPathExcludes
    }
    inputs.files(propertiesFiles)
    outputs.dir layout.buildDirectory.dir('native2ascii')
    doLast {
        def outputDir = layout.buildDirectory.dir('native2ascii').get().asFile
        outputDir.mkdirs()
        propertiesFiles.files.each { source ->
            def target = new File(outputDir, projectDir.toPath().relativize(source.toPath()).toString())
            target.parentFile.mkdirs()
            def properties = new Properties()
            source.withReader('UTF-8') { reader ->
                properties.load(reader)
            }
            target.withWriter('ISO-8859-1') { writer ->
                properties.store(writer, null)
            }
        }
        println "Converted ${propertiesFiles.files.size()} properties file(s)."
    }
}

tasks.register('scp') {
    group = 'distribution'
    description = 'Copies backend WAR with scp when scp.host, scp.user and scp.path are provided.'
    dependsOn ':backend:war'
    doLast {
        def host = findProperty('scp.host')
        def user = findProperty('scp.user')
        def targetPath = findProperty('scp.path')
        def identity = findProperty('scp.identity')

        if (!host || !user || !targetPath) {
            println 'SCP skipped. Set -Pscp.host=... -Pscp.user=... -Pscp.path=...'
            return
        }

        def command = ['scp']
        if (identity) {
            command.addAll(['-i', identity.toString()])
        }
        command.addAll([
                project(':backend').tasks.named('war').get().archiveFile.get().asFile.absolutePath,
                "${user}@${host}:${targetPath}".toString()
        ])
        def output = runCommand(command)
        if (output.trim()) {
            println output
        }
    }
}

tasks.register('doc') {
    group = 'documentation'
    description = 'Generates backend Javadoc.'
    dependsOn ':backend:javadoc'
}

tasks.register('alt', Zip) {
    group = 'distribution'
    description = 'Builds alternate project archive.'
    dependsOn tasks.named('build')
    archiveBaseName = 'WEBLAB333-alt'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(projectDir) {
        exclude generatedPathExcludes
    }
}

tasks.register('history') {
    group = 'versioning'
    description = 'Saves recent Git history to build/history/history.txt.'
    outputs.file layout.buildDirectory.file('history/history.txt')
    doLast {
        def output = runCommand(['git', 'log', '--oneline', '-n', '10'])
        def target = layout.buildDirectory.file('history/history.txt').get().asFile
        target.parentFile.mkdirs()
        target.text = output
        println "History saved to ${target}"
    }
}

tasks.register('diff') {
    group = 'versioning'
    description = 'Saves current Git diff to build/reports/git-diff.patch.'
    outputs.file layout.buildDirectory.file('reports/git-diff.patch')
    doLast {
        def output = runCommand(['git', 'diff'])
        def target = layout.buildDirectory.file('reports/git-diff.patch').get().asFile
        target.parentFile.mkdirs()
        target.text = output
        println "Diff saved to ${target}"
    }
}

tasks.register('report', Copy) {
    group = 'verification'
    description = 'Copies JUnit XML reports to root build reports.'
    dependsOn ':backend:test'
    from(project(':backend').layout.buildDirectory.dir('test-results/test'))
    into layout.buildDirectory.dir('reports/junit')
}

def teamMetadataDir = layout.buildDirectory.dir('team')

tasks.register('team', Zip) {
    group = 'distribution'
    description = 'Packages build artifacts with four latest Git revision hashes.'
    dependsOn tasks.named('build')
    archiveBaseName = 'WEBLAB333-team'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(project(':backend').layout.buildDirectory.dir('libs')) {
        into 'backend-libs'
    }
    from(teamMetadataDir) {
        into 'metadata'
    }
    doFirst {
        def output = runCommand(['git', 'log', '--format=%H', '-n', '4'])
        def metadataDir = teamMetadataDir.get().asFile
        metadataDir.mkdirs()
        new File(metadataDir, 'revisions.txt').text = output
    }
}

tasks.register('env') {
    group = 'help'
    description = 'Prints build environment information.'
    doLast {
        println "Java: ${System.getProperty('java.version')}"
        println "Gradle: ${gradle.gradleVersion}"
        println "OS: ${System.getProperty('os.name')} ${System.getProperty('os.version')}"
        println "User: ${System.getProperty('user.name')}"
        println "Project: ${projectDir}"
    }
}
